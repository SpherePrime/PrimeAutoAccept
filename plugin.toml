[plugin]
id = "dwertyfa-primeautoaccept"
name = "PrimeAutoAccept"
version = "0.1.0"
description = "Auto-accepts matches in League of Legends, Dota 2 and Counter-Strike 2."
author = ""
min_astra_version = "0.2.1"

[entry]
command = "target/release/prime_auto_accept"

[capabilities]
tools = true
triggers = true

[permissions]
fire_trigger = { reason = "Starts your automations when a match is found or accepted." }

[platform]
os = ["windows"]
arch = ["x86_64"]

[config]
schema = "{\"title\":\"Settings\",\"type\":\"object\",\"properties\":{\"accept_delay_ms\":{\"title\":\"$config.accept_delay_ms.title\",\"description\":\"$config.accept_delay_ms.description\",\"type\":\"integer\",\"format\":\"uint64\",\"default\":1500,\"maximum\":10000,\"minimum\":0},\"cs2\":{\"title\":\"$config.cs2.title\",\"description\":\"$config.cs2.description\",\"type\":\"boolean\",\"default\":true},\"dota2\":{\"title\":\"$config.dota2.title\",\"description\":\"$config.dota2.description\",\"type\":\"boolean\",\"default\":true},\"focus_game\":{\"title\":\"$config.focus_game.title\",\"description\":\"$config.focus_game.description\",\"type\":\"boolean\",\"default\":true},\"lol\":{\"title\":\"$config.lol.title\",\"description\":\"$config.lol.description\",\"type\":\"boolean\",\"default\":true},\"lol_install_dir\":{\"title\":\"$config.lol_install_dir.title\",\"description\":\"$config.lol_install_dir.description\",\"type\":\"string\",\"default\":\"\"}}}"
