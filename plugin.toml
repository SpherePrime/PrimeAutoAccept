[plugin]
id = "dwertyfa-primeautoaccept"
name = "PrimeAutoAccept"
version = "0.1.0"
description = "Auto-accepts matches in League of Legends, Dota 2 and Counter-Strike 2."
author = ""
min_astra_version = "0.2.1"

[entry]
command = "target/release/prime_auto_accept"

[capabilities]
tools = true
triggers = true

[permissions]
fire_trigger = { reason = "Starts your automations when a match is found or accepted." }

[platform]
os = ["windows"]
arch = ["x86_64"]

[config]
schema = "{\"title\":\"Settings\",\"type\":\"object\",\"properties\":{\"accept_delay_ms\":{\"title\":\"Accept delay, ms\",\"description\":\"Wait this many milliseconds before accepting\",\"type\":\"integer\",\"format\":\"uint64\",\"default\":1500,\"maximum\":10000,\"minimum\":0},\"cs2\":{\"title\":\"Counter-Strike 2\",\"description\":\"Accept Counter-Strike 2 matches\",\"type\":\"boolean\",\"default\":true},\"dota2\":{\"title\":\"Dota 2\",\"description\":\"Accept Dota 2 matches\",\"type\":\"boolean\",\"default\":true},\"focus_game\":{\"title\":\"Focus the game window\",\"description\":\"Bring Dota 2 or CS2 to the front to press Accept\",\"type\":\"boolean\",\"default\":true},\"lol\":{\"title\":\"League of Legends\",\"description\":\"Accept League of Legends ready checks\",\"type\":\"boolean\",\"default\":true},\"lol_install_dir\":{\"title\":\"League of Legends folder\",\"description\":\"League of Legends folder, if the client is not found automatically\",\"type\":\"string\",\"default\":\"\"}}}"
